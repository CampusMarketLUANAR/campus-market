<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Campus Market - Register</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


<div class="auth-container">


    <div class="auth-card">


        <div class="brand">

            <h1>
                🎓 Campus Market
            </h1>

            <p>
                Join your campus buying community
            </p>

        </div>



        <h2>
            Create Account 🚀
        </h2>


        <p class="subtitle">
            Register to start buying and selling
        </p>




        <div class="input-group">

            <span>👤</span>

            <input
            id="name"
            type="text"
            placeholder="Full Name">

        </div>




        <div class="input-group">

            <span>📧</span>

            <input
            id="email"
            type="email"
            placeholder="Email">

        </div>




        <div class="input-group">

            <span>📱</span>

            <input
            id="phone"
            type="text"
            placeholder="Phone Number">

        </div>




        <div class="input-group">

            <span>🔒</span>

            <input
            id="password"
            type="password"
            placeholder="Password">


            <button
            type="button"
            id="togglePassword">

                👁

            </button>


        </div>




        <button
        class="auth-btn"
        onclick="register()">

            Create Account

        </button>




        <p id="register-message"></p>




        <p class="switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>




    </div>


</div>




<script src="register.js"></script>


</body>

</html>
