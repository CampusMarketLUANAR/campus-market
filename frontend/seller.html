<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Profile - Campus Market</title>

<link rel="stylesheet" href="style.css">

</head>


<body>



<header>


    <div class="logo">

        <h1>
            Campus Market
        </h1>

        <p>
            Student Marketplace
        </p>

    </div>





    <a href="index.html">

        <button class="sell-btn">

            ← Home

        </button>


    </a>



</header>






<main>


<section class="seller-page">



    <!-- SELLER PROFILE -->

    <div 
    id="seller-profile"
    class="seller-profile-card">


        <div class="seller-loading">

            Loading seller profile...

        </div>


    </div>








    <!-- SELLER STATS -->


    <div 
    id="seller-stats"
    class="seller-stats-card">


        <div>

            <h3>
                0
            </h3>

            <p>
                Products
            </p>

        </div>




        <div>

            <h3>
                ⭐ 0
            </h3>

            <p>
                Rating
            </p>

        </div>




        <div>

            <h3>
                0
            </h3>

            <p>
                Reviews
            </p>

        </div>


    </div>









    <!-- CHAT BUTTON -->

    <div 
    id="seller-actions"
    class="seller-actions">


    </div>









    <!-- RATING SECTION -->


    <div 
    id="rating-box"
    class="rating-card">


        Loading ratings...


    </div>









    <!-- SELLER PRODUCTS -->


    <h2 class="section-title">

        🛒 Products by Seller

    </h2>






    <div

    class="products"

    id="seller-products">


        <p>
            Loading products...
        </p>


    </div>









    <!-- REVIEWS -->


    <h2 class="section-title">

        ⭐ Customer Reviews

    </h2>






    <div

    id="reviews-list"

    class="reviews-container">


        <p>
            No reviews yet.
        </p>


    </div>






</section>



</main>







<script src="seller.js"></script>


</body>


</html>
